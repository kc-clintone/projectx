<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPulse - Go Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-800">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-100">
                    <span class="text-white font-bold text-2xl">EP</span>
                </div>
                <div>
                    <h1 class="text-xl font-black bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent leading-none">
                        EduPulse
                    </h1>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Go Backend Edition</span>
                </div>
            </div>
            <div id="user-info" class="hidden flex items-center gap-4">
                <span id="user-name" class="text-sm font-bold text-slate-600"></span>
                <button onclick="app.logout()" class="text-xs font-bold text-red-500 hover:text-red-700">Sign Out</button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-container" class="flex-1 max-w-5xl mx-auto w-full p-4 sm:p-8 relative">
        <!-- Views will be injected here by JS -->
        <div id="loading-overlay" class="hidden fixed inset-0 bg-white/80 backdrop-blur-sm z-[60] flex flex-col items-center justify-center">
            <div class="w-16 h-16 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin"></div>
            <p id="loading-text" class="mt-4 text-indigo-900 font-bold animate-pulse">Processing...</p>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-100 py-10 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-slate-400 text-sm">
            &copy; 2026 EduPulse. Powered by Go & Gemini.
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
