<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Study Coach</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 2rem auto; }
    label { display:block; margin-top:1rem }
    textarea { width:100%; height:80px }
    .tasks { margin-top:1rem }
    .task { border:1px solid #ddd; padding:8px; margin-top:6px; display:flex; gap:12px; align-items:center }
    .meta { flex:1 }
    .controls { width:260px }
    button { cursor:pointer }
    .profile { border:1px solid #ccc; padding:12px; margin-top:16px }
    .progress-bar { background:#eee; border-radius:6px; height:14px; overflow:hidden }
    .progress-fill { height:100%; background:linear-gradient(90deg,#6ad,#3a8); width:0% }
    .achievements { display:flex; gap:8px; flex-wrap:wrap }
    .badge { background:#ffd; border:1px solid #cc9; padding:6px 8px; border-radius:6px; display:flex; gap:8px; align-items:center }
    .badge .icon { font-size:18px }
    .recap { margin-top:8px }

    /* Toast styles */
    .toast-container { position: fixed; right: 20px; top: 20px; z-index: 1000; display:flex; flex-direction:column; gap:10px }
    .toast { background: #111; color:#fff; padding:10px 14px; border-radius:8px; box-shadow: 0 6px 18px rgba(0,0,0,0.25); opacity:0; transform: translateY(-10px); animation: slideIn 400ms ease forwards }
    .toast .badge-mini { display:inline-flex; align-items:center; gap:8px }
    @keyframes slideIn { to { opacity:1; transform: translateY(0); } }
    @keyframes slideOut { to { opacity:0; transform: translateY(-10px); } }
  </style>
</head>
<body>
  <h1>Study Coach - Demo UI</h1>
  <form id="sessionForm">
    <label>Student ID <input name="student_id" required /></label>
    <label>Level <input name="student_level" value="grade10" /></label>
    <label>Subject <input name="subject" value="math" /></label>
    <label>Tasks (one per line)
      <textarea name="tasks"></textarea>
    </label>
    <button type="submit">Create Session</button>
  </form>

  <div id="sessionArea" style="display:none">
    <h2>Session</h2>
    <div id="sessionData"></div>
    <div class="tasks" id="taskList"></div>
    <div style="margin-top:12px">
      <button id="startTimers">Start All Timers</button>
      <button id="submitResults">Submit Results</button>
      <button id="viewProfile">View Profile</button>
    </div>
  </div>

  <div id="profileArea" class="profile" style="display:none">
    <h2>Student Profile</h2>
    <div><strong>ID:</strong> <span id="pf_id"></span></div>
    <div style="margin-top:6px"><strong>Points:</strong> <span id="pf_points">0</span> &nbsp; <strong>Streak:</strong> <span id="pf_streak">0</span></div>
    <div style="margin-top:8px"><strong>Topics & Progress</strong></div>
    <div id="pf_topics"></div>
    <div style="margin-top:8px"><strong>Achievements</strong></div>
    <div id="pf_achievements" class="achievements"></div>
    <div style="margin-top:8px"><strong>Weekly Recap</strong></div>
    <div id="pf_recap" class="recap"></div>
  </div>

  <div class="toast-container" id="toasts"></div>
  <pre id="result"></pre>

  <script>
    let currentSession = null
    let intervals = []
    const shownBadges = new Set()

    function makeTaskEl(t, idx){
      const el = document.createElement('div')
      el.className='task'
      el.dataset.index = idx
      el.innerHTML = `<div class="meta"><strong>Task ${idx+1}</strong> <div>Prompt: ${t.prompt}</div><div>Estimated: ${t.estimated_secs}s</div><div>Topics: ${(t.topics||[]).join(', ')}</div></div><div class="controls"><div>Elapsed: <span class="actual">0</span>s</div><div style="margin-top:6px"><button class="done">Complete</button> <button class="reset">Reset</button></div><div style="margin-top:6px"><label><input type="checkbox" class="correct" /> Correct</label></div></div>`
      return el
    }

    function showToast(badge){
      const container = document.getElementById('toasts')
      const t = document.createElement('div')
      t.className = 'toast'
      t.innerHTML = `<div class="badge-mini" style="background:${badge.color}; color:#000; padding:6px 8px; border-radius:6px"><span class="icon">${badge.icon}</span><strong>${badge.name}</strong></div><div style="margin-top:6px">${badge.description}</div>`
      container.appendChild(t)
      // auto remove after 4s with fade
      setTimeout(()=>{ t.style.animation = 'slideOut 400ms ease forwards'; setTimeout(()=>t.remove(), 420) }, 3600)
    }

    function renderProfile(profile){
      document.getElementById('profileArea').style.display = 'block'
      document.getElementById('pf_id').textContent = profile.student_id
      document.getElementById('pf_points').textContent = profile.points || 0
      document.getElementById('pf_streak').textContent = profile.streak || 0

      const topicsDiv = document.getElementById('pf_topics')
      topicsDiv.innerHTML = ''
      let total = 0
      for(const k in profile.topics) total += profile.topics[k]
      const entries = Object.entries(profile.topics).sort((a,b)=>b[1]-a[1])
      entries.forEach(([k,v])=>{
        const pct = total===0?0:Math.max(0, 100 - Math.round((v/total)*100))
        const div = document.createElement('div')
        div.innerHTML = `<div><strong>${k}</strong> <small>(${v})</small></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`
        topicsDiv.appendChild(div)
      })

      const ach = document.getElementById('pf_achievements')
      ach.innerHTML = ''
      (profile.earned_badges||[]).forEach(b=>{
        const bd = document.createElement('div')
        bd.className = 'badge'
        // attempt to use svg asset if available
        const img = document.createElement('img')
        img.width = 36
        img.height = 36
        img.style.borderRadius = '6px'
        img.style.objectFit = 'cover'
        img.onerror = function(){ this.style.display='none' }
        img.src = `/ui/assets/badges/${b.id}.svg`
        bd.appendChild(img)
        const info = document.createElement('div')
        info.innerHTML = `<strong>${b.name}</strong><div style="font-size:12px">${b.description}</div><div style="font-size:12px;color:#666">+${b.points} pts</div>`
        bd.appendChild(info)
        bd.style.borderColor = b.color
        bd.style.background = '#fff'
        ach.appendChild(bd)
        // toast new badges
        if(!shownBadges.has(b.id)){
          shownBadges.add(b.id)
          showToast(b)
        }
      })

      const recap = document.getElementById('pf_recap')
      recap.innerHTML = ''
      (profile.weekly_recap||[]).forEach(r=>{ const p=document.createElement('div'); p.textContent = `${r.topic}: improved by ${r.improved_by}`; recap.appendChild(p) })
    }

    document.getElementById('sessionForm').addEventListener('submit', async (e)=>{
      e.preventDefault()
      const form = e.target
      const body = { student_id: form.student_id.value, student_level: form.student_level.value, subject: form.subject.value, tasks: form.tasks.value.split('\n').filter(Boolean).map((t,i)=>({id: String(i+1), prompt: t})) }
      const res = await fetch('/api/v1/session', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) })
      if(!res.ok){ alert('failed to create session'); return }
      const data = await res.json()
      currentSession = data
      document.getElementById('sessionArea').style.display='block'
      document.getElementById('sessionData').textContent = JSON.stringify(data, null, 2)
      const tlist = document.getElementById('taskList')
      tlist.innerHTML = ''
      data.tasks.forEach((t, idx)=>{
        const el = makeTaskEl(t, idx)
        tlist.appendChild(el)
      })
    })

    document.getElementById('startTimers').addEventListener('click', ()=>{
      if(!currentSession) return
      intervals.forEach(iv=>clearInterval(iv))
      intervals = []
      document.querySelectorAll('.task').forEach((el, idx)=>{
        let sec = 0
        const actualEl = el.querySelector('.actual')
        const doneBtn = el.querySelector('.done')
        const resetBtn = el.querySelector('.reset')
        const correctCb = el.querySelector('.correct')
        const iv = setInterval(()=>{ sec++; actualEl.textContent = sec }, 1000)
        intervals.push(iv)
        doneBtn.onclick = ()=>{ clearInterval(iv); actualEl.textContent = sec; el.dataset.actual = sec }
        resetBtn.onclick = ()=>{ clearInterval(iv); sec = 0; actualEl.textContent = 0; delete el.dataset.actual }
        correctCb.onclick = ()=>{ el.dataset.correct = correctCb.checked }
      })
    })

    async function fetchProfileFor(studentID){
      const res = await fetch(`/api/v1/student/${studentID}/profile`)
      if(!res.ok) return null
      return await res.json()
    }

    document.getElementById('viewProfile').addEventListener('click', async ()=>{
      const sid = (currentSession && currentSession.student_id) || document.querySelector('input[name="student_id"]').value
      if(!sid) return alert('provide student id')
      const p = await fetchProfileFor(sid)
      if(p) renderProfile(p)
    })

    document.getElementById('submitResults').addEventListener('click', async ()=>{
      if(!currentSession) return
      intervals.forEach(iv=>clearInterval(iv))
      intervals = []
      const results = Array.from(document.querySelectorAll('.task')).map((el, idx)=>({ actual_seconds: Number(el.dataset.actual)||0, correct: el.dataset.correct === 'true' }))
      const body = { session_id: currentSession.id, results }
      const res = await fetch('/api/v1/submit_results', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) })
      if(!res.ok){ alert('submit failed'); return }
      const data = await res.json()
      document.getElementById('result').textContent = JSON.stringify(data, null, 2)
      const p = await fetchProfileFor(currentSession.student_id)
      if(p) renderProfile(p)
    })
  </script>
</body>
</html>
