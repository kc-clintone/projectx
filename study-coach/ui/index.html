<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Study Coach</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f8fb; --card:#fff; --muted:#6b7280; --accent:#0ea5a4; --accent-2:#7c3aed;
      --radius:12px; --shadow: 0 8px 24px rgba(16,24,40,0.08);
    }
    html,body{height:100%}
    body{font-family:Inter,system-ui,Segoe UI,Arial; background:var(--bg); margin:0; color:#0f172a}
    .app{max-width:1100px;margin:28px auto;padding:20px;display:grid;grid-template-columns:340px 1fr;gap:20px}
    .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
    header h1{margin:0;font-size:20px}
    .muted{color:var(--muted);font-size:13px}

    /* left profile */
    .profile-top{display:flex;gap:12px;align-items:center}
    .avatar{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:20px}
    .points{font-weight:700;font-size:18px}
    .badges-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .badge-sm{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:#fff;border:1px solid #eee}
    .badge-sm img{width:28px;height:28px}

    /* main area */
    .session-form label{display:block;margin-top:12px}
    textarea{width:100%;min-height:110px;padding:8px;border-radius:8px;border:1px solid #e6edf3}
    input,button{font-family:inherit}
    .controls-row{display:flex;gap:8px;margin-top:12px}
    button.btn{background:var(--accent);color:#fff;border:none;padding:10px 12px;border-radius:10px;cursor:pointer}
    button.ghost{background:transparent;border:1px solid #e6edf3;color:var(--muted)}

    .tasks{margin-top:12px}
    .task{display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:8px;border:1px dashed #e6edf3;background:linear-gradient(180deg,#fff,#fcfeff)}
    .task + .task{margin-top:8px}

    /* progress */
    .progress-bar{background:#eef2f7;border-radius:999px;height:12px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,#10b981,#06b6d4);width:0%}

    /* toast */
    .toast-wrap{position:fixed;right:20px;top:20px;z-index:9999;display:flex;flex-direction:column;gap:10px}
    .toast{background:#111;color:#fff;padding:12px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(2,6,23,0.2);transform:translateY(-10px);opacity:0;animation:toastIn .36s forwards}
    @keyframes toastIn{to{transform:none;opacity:1}}

    .recap{margin-top:12px}

    @media(max-width:900px){.app{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <div class="profile-top">
        <div class="avatar" id="avatar">SC</div>
        <div>
          <div id="pf_name">Study Coach</div>
          <div class="muted">ID: <span id="pf_id_small">-</span></div>
        </div>
      </div>
      <div style="margin-top:12px">
        <div class="muted">Points</div>
        <div class="points" id="pf_points">0</div>
      </div>
      <div style="margin-top:12px">
        <div class="muted">Streak</div>
        <div id="pf_streak">0 days</div>
      </div>

      <div style="margin-top:14px">
        <div class="muted">Badges</div>
        <div class="badges-grid" id="pf_badges"></div>
      </div>

      <div style="margin-top:14px">
        <div class="muted">Weekly Recap</div>
        <div id="pf_recap_small" class="recap"></div>
      </div>
    </div>

    <div>
      <div class="panel session-form">
        <header><h1>Create / Run Session</h1><div class="muted">Create timed tasks and submit results to get a study plan</div></header>
        <form id="sessionForm">
          <label>Student ID <input name="student_id" required placeholder="e.g. stu123" style="width:180px;margin-left:8px" /></label>
          <label>Level <input name="student_level" value="grade10" style="width:160px;margin-left:8px" /></label>
          <label>Subject <input name="subject" value="math" style="width:160px;margin-left:8px" /></label>
          <label>Tasks (one per line)
            <textarea name="tasks" placeholder="Enter each task or question on its own line"></textarea>
          </label>
          <div class="controls-row">
            <button class="btn" type="submit">Create Session</button>
            <button class="ghost" id="viewProfileSmall" type="button">View Profile</button>
          </div>
        </form>

        <div id="sessionArea" style="display:none;margin-top:18px">
          <h3>Active Session</h3>
          <div id="sessionData" class="muted" style="font-size:13px"></div>
          <div class="tasks" id="taskList"></div>
          <div style="margin-top:12px;display:flex;gap:8px">
            <button class="btn" id="startTimers">Start Timers</button>
            <button class="btn" id="submitResults">Submit Results</button>
            <button class="ghost" id="resetSession">Reset</button>
          </div>
        </div>

        <div id="planArea" style="display:none;margin-top:18px">
          <h3>Study Plan</h3>
          <div id="planFocus"></div>
          <div style="margin-top:12px">
            <div class="muted">Next timers</div>
            <div id="planTimers" style="display:flex;gap:8px;margin-top:8px"></div>
          </div>
        </div>
      </div>

      <div class="panel" style="margin-top:12px">
        <h3>Results & Activity</h3>
        <pre id="result" style="white-space:pre-wrap;max-height:220px;overflow:auto"></pre>
      </div>
    </div>
  </div>

  <div class="toast-wrap" id="toasts"></div>

  <script>
    // lightweight helper functions
    const $ = s=>document.querySelector(s)
    const $$ = s=>Array.from(document.querySelectorAll(s))

    let currentSession = null
    let intervals = []
    const shownBadges = new Set()

    function makeTaskEl(t, idx){
      const el = document.createElement('div')
      el.className='task'
      el.dataset.index = idx
      el.innerHTML = `<div><div style="font-weight:600">Task ${idx+1}</div><div style="font-size:13px;color:var(--muted)">${t.prompt}</div><div style="margin-top:6px;font-size:12px">Topics: ${(t.topics||[]).join(', ')}</div></div><div style="min-width:220px;text-align:right"><div>Estimated: <strong>${t.estimated_secs}s</strong></div><div style="margin-top:6px">Elapsed: <span class="actual">0</span>s</div><div style="margin-top:8px"><label style="font-size:13px"><input type="checkbox" class="correct"/> Correct</label></div></div>`
      return el
    }

    function toast(b){
      const wrap = $('#toasts')
      const t = document.createElement('div')
      t.className='toast'
      t.innerHTML = `<div style="font-size:20px">${b.icon}</div><div style="margin-left:8px"><div style="font-weight:700">${b.name}</div><div style="font-size:13px;color:#e6eef2">${b.description}</div><div style="margin-top:6px;font-size:12px">+${b.points} pts</div></div>`
      wrap.appendChild(t)
      // small confetti effect
      confetti()
      setTimeout(()=>{ t.style.opacity=0; t.style.transform='translateY(-10px)'; setTimeout(()=>t.remove(),400) },3800)
    }

    function confetti(){
      // simple emoji confetti
      const wrap = document.body
      for(let i=0;i<8;i++){
        const d = document.createElement('div')
        d.textContent = ['🎉','✨','🎈','💫'][Math.floor(Math.random()*4)]
        d.style.position='fixed'
        d.style.left = (20 + Math.random()*80)+'%'
        d.style.top = (10 + Math.random()*60)+'%'
        d.style.fontSize = (12 + Math.random()*18)+'px'
        d.style.opacity = 1
        wrap.appendChild(d)
        setTimeout(()=>{ d.style.transition='all 900ms ease'; d.style.top = (parseFloat(d.style.top) - 80) + '%'; d.style.opacity=0 }, 50)
        setTimeout(()=>d.remove(),1000)
      }
    }

    async function fetchProfileFor(id){
      const res = await fetch(`/api/v1/student/${id}/profile`)
      if(!res.ok) return null
      return await res.json()
    }

    function renderProfileSmall(profile){
      if(!profile) return
      $('#pf_id_small').textContent = profile.student_id
      $('#pf_points').textContent = profile.points || 0
      $('#pf_streak').textContent = (profile.streak||0) + ' days'
      const badgesEl = $('#pf_badges')
      badgesEl.innerHTML=''
      (profile.earned_badges||[]).forEach(b=>{
        const el = document.createElement('div')
        el.className='badge-sm'
        const img = document.createElement('img')
        img.src = `/ui/assets/badges/${b.id}.svg`
        img.onerror = ()=>img.style.display='none'
        el.appendChild(img)
        const span = document.createElement('div')
        span.innerHTML = `<strong style="font-size:13px">${b.name}</strong><div style='font-size:12px;color:var(--muted)'>+${b.points} pts</div>`
        el.appendChild(span)
        badgesEl.appendChild(el)
        if(!shownBadges.has(b.id)){ shownBadges.add(b.id); toast(b) }
      })

      const recap = $('#pf_recap_small')
      recap.innerHTML=''
      (profile.weekly_recap||[]).forEach(r=>{
        const d = document.createElement('div')
        d.textContent = `${r.topic}: improved by ${r.improved_by}`
        recap.appendChild(d)
      })
    }

    $('#sessionForm').addEventListener('submit', async e=>{
      e.preventDefault()
      const form = e.target
      const body = { student_id: form.student_id.value, student_level: form.student_level.value, subject: form.subject.value, tasks: form.tasks.value.split('\n').filter(Boolean).map((t,i)=>({id:String(i+1),prompt:t})) }
      const res = await fetch('/api/v1/session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
      if(!res.ok){ alert('failed to create session'); return }
      const data = await res.json()
      currentSession = data
      $('#sessionArea').style.display = 'block'
      $('#sessionData').textContent = `Session ${data.id} • ${data.tasks.length} tasks` 
      const tlist = $('#taskList'); tlist.innerHTML=''
      data.tasks.forEach((t,i)=> tlist.appendChild(makeTaskEl(t,i)))
    })

    $('#startTimers').addEventListener('click', ()=>{
      if(!currentSession) return
      intervals.forEach(iv=>clearInterval(iv)); intervals=[]
      $$('.task').forEach((el,idx)=>{
        let sec=0; const actual = el.querySelector('.actual'); const cb = el.querySelector('.correct')
        const iv = setInterval(()=>{ sec++; actual.textContent = sec }, 1000)
        intervals.push(iv)
        el.addEventListener('click', e=>{})
        // allow clicking the row to mark complete
        el.addEventListener('dblclick', ()=>{ clearInterval(iv); el.dataset.actual = sec; actual.textContent = sec })
      })
    })

    $('#submitResults').addEventListener('click', async ()=>{
      if(!currentSession) return
      intervals.forEach(iv=>clearInterval(iv)); intervals=[]
      const results = $$('.task').map(el=>({ actual_seconds: Number(el.dataset.actual)||0, correct: el.querySelector('.correct').checked }))
      const body = { session_id: currentSession.id, results }
      const res = await fetch('/api/v1/submit_results',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
      if(!res.ok){ alert('submit failed'); return }
      const plan = await res.json()
      $('#planArea').style.display='block'
      $('#planFocus').textContent = JSON.stringify(plan.focus,null,2)
      const timers = $('#planTimers'); timers.innerHTML=''
      (plan.next_timers||[]).forEach(t=>{ const d=document.createElement('div'); d.textContent = t+'s'; d.style.padding='6px 8px'; d.style.background='#eef6f6'; d.style.borderRadius='8px'; timers.appendChild(d) })
      $('#result').textContent = JSON.stringify(plan,null,2)
      // update profile panel
      const p = await fetchProfileFor(currentSession.student_id)
      renderProfileSmall(p)
    })

    $('#viewProfileSmall').addEventListener('click', async ()=>{
      const sid = document.querySelector('input[name="student_id"]').value
      if(!sid) return alert('enter student id')
      const p = await fetchProfileFor(sid)
      renderProfileSmall(p)
    })
  </script>
</body>
</html>
